# ORQUOR — GitHub Actions CI/CD (simplificado)
name: Orquor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      
      - name: Install deps
        run: pip install pytest
      
      - name: Run verifiers (13 tests)
        run: |
          cd 06-hermes
          python -m pytest verifiers/translation_verifiers.py -v --tb=short

  content-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Count content files
        run: |
          echo "LinkedIn:  $(ls 09-content-calendar/linkedin/*.md 2>/dev/null | wc -l) posts"
          echo "X:         $(ls 09-content-calendar/x-twitter/*.md 2>/dev/null | wc -l) threads"
          echo "YouTube:   $(ls 09-content-calendar/youtube/*.md 2>/dev/null | wc -l) scripts"
          echo "Newsletter:$(ls 09-content-calendar/newsletter/*.md 2>/dev/null | wc -l) editions"
          echo "Email:     $(ls 09-content-calendar/email/*.md 2>/dev/null | wc -l) templates"
          echo "Legal:     $(ls 07-legal/*.md 2>/dev/null | wc -l) documents"
