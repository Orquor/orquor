# Dependabot configuration for ORQUOR
# Keeps GitHub Actions and pip dependencies current.
# Frequency: weekly. Strategy: grouped PRs to reduce noise.

version: 2
updates:
  # GitHub Actions — CI/CD workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Lima"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # pip — Python dependencies (Hermes platform + verifier suite)
  - package-ecosystem: "pip"
    directory: "/06-hermes"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Lima"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      pip:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
