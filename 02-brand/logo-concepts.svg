<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter Tight, system-ui">
  <style>
    .ink { fill: #0B0F14; }
    .bone { fill: #F4F1EB; }
    .signal { fill: #3B82F6; }
    .stroke-ink { stroke: #0B0F14; fill: none; }
    .stroke-signal { stroke: #3B82F6; fill: none; }
    .label { font-size: 18px; font-weight: 500; fill: #64748B; }
    .wordmark { font-size: 64px; font-weight: 700; letter-spacing: -0.02em; fill: #0B0F14; }
  </style>

  <rect width="1200" height="900" class="bone"/>

  <!-- Concept A: Loop doble (recommended) -->
  <g transform="translate(120, 100)">
    <text class="label" x="0" y="-20">CONCEPT A  Loop doble (recommended)</text>
    <g transform="translate(80, 100)">
      <circle cx="0" cy="0" r="60" class="stroke-ink" stroke-width="14" />
      <circle cx="80" cy="0" r="60" class="stroke-signal" stroke-width="14" />
    </g>
    <text class="wordmark" x="0" y="260">orquor</text>
  </g>

  <!-- Concept B: Q como centro -->
  <g transform="translate(620, 100)">
    <text class="label" x="0" y="-20">CONCEPT B  Q como centro (orquestación)</text>
    <g transform="translate(120, 130)">
      <circle cx="0" cy="0" r="55" class="stroke-ink" stroke-width="10" />
      <line x1="40" y1="40" x2="80" y2="80" class="stroke-ink" stroke-width="10" stroke-linecap="round"/>
      <!-- nodes around -->
      <circle cx="-110" cy="-60" r="10" class="signal"/>
      <circle cx="-110" cy="60" r="10" class="signal"/>
      <circle cx="110" cy="-60" r="10" class="signal"/>
      <circle cx="110" cy="60" r="10" class="signal"/>
      <line x1="-100" y1="-55" x2="-40" y2="-25" class="stroke-signal" stroke-width="2"/>
      <line x1="-100" y1="55" x2="-40" y2="25" class="stroke-signal" stroke-width="2"/>
      <line x1="100" y1="-55" x2="40" y2="-25" class="stroke-signal" stroke-width="2"/>
      <line x1="100" y1="55" x2="40" y2="25" class="stroke-signal" stroke-width="2"/>
    </g>
    <text class="wordmark" x="0" y="260">orquor</text>
  </g>

  <!-- Concept C: Monograma minimal -->
  <g transform="translate(120, 500)">
    <text class="label" x="0" y="-20">CONCEPT C  Monograma minimal</text>
    <g transform="translate(80, 100)">
      <circle cx="0" cy="0" r="55" class="stroke-ink" stroke-width="12" />
      <!-- circular arrow tip -->
      <path d="M 40 -38 L 60 -50 L 50 -28 Z" class="ink"/>
    </g>
    <text class="wordmark" x="0" y="260">orquor</text>
  </g>

  <!-- Color palette swatches -->
  <g transform="translate(620, 500)">
    <text class="label" x="0" y="-20">COLOR PALETTE</text>
    <rect x="0" y="20" width="60" height="60" fill="#0B0F14"/>
    <text x="0" y="105" font-size="12" fill="#64748B">orquor.ink</text>
    <rect x="80" y="20" width="60" height="60" fill="#F4F1EB" stroke="#E5E7EB"/>
    <text x="80" y="105" font-size="12" fill="#64748B">orquor.bone</text>
    <rect x="160" y="20" width="60" height="60" fill="#3B82F6"/>
    <text x="160" y="105" font-size="12" fill="#64748B">orquor.signal</text>
    <rect x="240" y="20" width="60" height="60" fill="#10B981"/>
    <text x="240" y="105" font-size="12" fill="#64748B">orquor.verify</text>
    <rect x="320" y="20" width="60" height="60" fill="#F59E0B"/>
    <text x="320" y="105" font-size="12" fill="#64748B">orquor.alert</text>
    <rect x="400" y="20" width="60" height="60" fill="#EF4444"/>
    <text x="400" y="105" font-size="12" fill="#64748B">orquor.error</text>
    <rect x="0" y="160" width="60" height="60" fill="#64748B"/>
    <text x="0" y="245" font-size="12" fill="#64748B">orquor.muted</text>

    <text class="label" x="0" y="290">TYPOGRAPHY</text>
    <text x="0" y="325" font-size="32" font-family="Inter Tight" font-weight="700">Inter Tight 700  display</text>
    <text x="0" y="365" font-size="18" font-family="Inter" font-weight="400">Inter 400  body copy</text>
    <text x="0" y="395" font-size="14" font-family="monospace">JetBrains Mono  code &amp; data</text>
  </g>
</svg>
